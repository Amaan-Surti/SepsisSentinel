server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # fail fast when the API container is down, so the UI can show its 'cannot reach the API' state
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/bed/:id, /tour, /evidence; old /patient/:id, /model redirect) fall back to the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
